        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightSchedule'
          description: ''
  /api/v1/flights/search/:
    get:
      operationId: flights_search_list
      summary: Search flights with filters
      parameters:
      - in: query
        name: airline
        schema:
          type: string
        description: Airline IATA code (e.g. EK)
      - in: query
        name: destination
        schema:
          type: string
        description: Destination airport IATA code (e.g. LHR)
      - in: query
        name: max_price
        schema:
          type: number
          format: float
        description: Max price ceiling
      - in: query
        name: origin
        schema:
          type: string
        description: Origin airport IATA code (e.g. DXB)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: stops
        schema:
          type: integer
        description: 0 for non-stop, 1, 2
      tags:
      - flights
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFlightScheduleList'
          description: ''
