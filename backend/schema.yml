      - updated_at
      - visa_country
      - visa_type
    VisaApplicationStatusEnum:
      enum:
      - submitted
      - documents_verified
      - embassy_processing
      - approved
      - rejected
      type: string
      description: |-
        * `submitted` - Application Submitted
        * `documents_verified` - Documents Verified
        * `embassy_processing` - Under Processing at Embassy
        * `approved` - Visa Approved / Issued
        * `rejected` - Action Required / Rejected
    VisaCountry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        visa_types:
          type: array
          items:
            $ref: '#/components/schemas/VisaType'
          readOnly: true
        country_name:
          type: string
          maxLength: 100
        country_code:
          type: string
          maxLength: 5
        flag_emoji:
          type: string
          maxLength: 10
        processing_time_days:
          type: string
          maxLength: 50
        starting_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        image_url:
          type: string
          nullable: true
          maxLength: 500
        description:
          type: string
          nullable: true
        requirements_checklist: {}
        is_popular:
          type: boolean
      required:
      - country_code
      - country_name
      - id
      - visa_types
    VisaType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 150
        validity_duration:
          type: string
          maxLength: 50
        stay_duration:
          type: string
          maxLength: 50
        entry_type:
          type: string
          maxLength: 50
        government_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        service_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        total_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        express_available:
          type: boolean
        country:
          type: integer
      required:
      - country
      - id
      - title
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
