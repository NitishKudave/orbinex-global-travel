      operationId: hotels_search_list
      summary: Search hotels by city, rating, and amenities
      parameters:
      - in: query
        name: breakfast_included
        schema:
          type: boolean
        description: Breakfast included filter
      - in: query
        name: city
        schema:
          type: string
        description: City name or destination
      - in: query
        name: free_cancellation
        schema:
          type: boolean
        description: Free cancellation filter
      - in: query
        name: max_price
        schema:
          type: number
          format: float
        description: Maximum price per night
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: star_rating
        schema:
          type: integer
        description: Minimum star rating (1-5)
      tags:
