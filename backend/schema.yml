          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHolidayDestinationList'
          description: ''
  /api/v1/holidays/packages/:
    get:
      operationId: holidays_packages_list
      summary: Search holiday tour packages
      parameters:
      - in: query
        name: destination
        schema:
          type: string
        description: Destination name or country
      - in: query
        name: duration
        schema:
          type: integer
        description: Duration in days
      - in: query
        name: max_price
        schema:
          type: number
          format: float
        description: Maximum price per person
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: trending
        schema:
          type: boolean
