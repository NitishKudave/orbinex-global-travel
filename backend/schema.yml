          description: ''
  /api/v1/europamundo/tours/:
    get:
      operationId: europamundo_tours_list
      summary: List Europamundo guided tours
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: Country filter
      - in: query
        name: max_price
        schema:
          type: number
          format: float
        description: Maximum price USD
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - europamundo
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEuropamundoTourListList'
          description: ''
  /api/v1/europamundo/tours/{id}/:
    get:
      operationId: europamundo_tours_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - europamundo
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EuropamundoTourDetail'
          description: ''
  /api/v1/flights/airports/:
    get:
      operationId: flights_airports_list
      summary: List / Search airports for autocomplete
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - flights
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAirportList'
          description: ''
  /api/v1/flights/book/:
    post:
      operationId: flights_book_create
      summary: Book a flight directly
      tags:
      - flights
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightBooking'
          description: ''
  /api/v1/flights/schedules/{id}/:
    get:
      operationId: flights_schedules_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - flights
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
