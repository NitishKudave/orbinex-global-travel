components:
  schemas:
    Airline:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        iata_code:
          type: string
          maxLength: 5
        logo_url:
          type: string
          nullable: true
          maxLength: 255
      required:
      - iata_code
      - id
      - name
    Airport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        city:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        iata_code:
          type: string
          maxLength: 5
      required:
      - city
      - country
      - iata_code
      - id
      - name
    AirportLounge:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        airport_code:
          type: string
          maxLength: 5
        airport_name:
          type: string
          maxLength: 150
        terminal:
          type: string
          maxLength: 50
        lounge_name:
          type: string
          maxLength: 150
        operating_hours:
          type: string
          maxLength: 100
        price_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        amenities: {}
        image_url:
          type: string
          nullable: true
          maxLength: 500
      required:
      - airport_code
      - airport_name
      - id
      - lounge_name
    ApplicableModuleEnum:
      enum:
      - all
      - flight
      - hotel
      - holiday
      - visa
      - insurance
      type: string
      description: |-
        * `all` - All Travel Modules
        * `flight` - Flights Only
        * `hotel` - Hotels Only
        * `holiday` - Holiday Packages Only
        * `visa` - Visa Only
        * `insurance` - Insurance Only
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        booking_reference:
          type: string
          readOnly: true
        booking_type:
          $ref: '#/components/schemas/BookingTypeEnum'
        status:
          $ref: '#/components/schemas/BookingStatusEnum'
        payment_status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        currency:
          type: string
          maxLength: 5
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        final_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        coupon_code:
          type: string
          nullable: true
          maxLength: 50
        contact_name:
          type: string
          maxLength: 150
        contact_email:
          type: string
          format: email
          maxLength: 254
        contact_phone:
          type: string
          maxLength: 30
        title:
          type: string
          maxLength: 255
        summary:
          type: string
          nullable: true
        details_json: {}
        travel_date:
          type: string
          format: date
          nullable: true
        return_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          nullable: true
      required:
      - booking_reference
      - booking_type
      - contact_email
      - contact_name
      - contact_phone
      - created_at
      - final_amount
      - id
      - total_amount
      - updated_at
      - username
    BookingStatusEnum:
      enum:
      - pending
      - confirmed
      - processing
      - completed
      - cancelled
      - refunded
      type: string
      description: |-
        * `pending` - Pending
        * `confirmed` - Confirmed
        * `processing` - Processing / Under Review
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `refunded` - Refunded
    BookingTypeEnum:
      enum:
      - flight
      - hotel
      - bus
      - visa
      - insurance
      - holiday
      - umrah
      - medical_tourism
      - europamundo
      - utility
      - mixed
      type: string
      description: |-
        * `flight` - Flight Booking
        * `hotel` - Hotel Booking
        * `bus` - Bus Booking
        * `visa` - Visa Application
        * `insurance` - Travel Insurance Policy
        * `holiday` - Holiday Package Tour
        * `umrah` - Umrah Pilgrimage Package
        * `medical_tourism` - Medical Tourism Package
        * `europamundo` - Europamundo Tour Circuit
        * `utility` - Travel Utility (eSIM/Forex/Lounge)
        * `mixed` - Unified Multi-Item Booking
    BusBooking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        trip:
          allOf:
          - $ref: '#/components/schemas/BusTrip'
          readOnly: true
        selected_seats: {}
        passengers: {}
        boarding_point:
          type: string
          maxLength: 255
        dropping_point:
          type: string
          maxLength: 255
        m_ticket_number:
          type: string
          nullable: true
          maxLength: 50
        booking:
          type: integer
      required:
      - boarding_point
      - booking
      - dropping_point
      - id
      - trip
    BusOperator:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        logo_url:
          type: string
          nullable: true
          maxLength: 255
        rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
        total_reviews:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
      required:
      - id
      - name
    BusSeat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        seat_number:
          type: string
          maxLength: 10
        deck:
          $ref: '#/components/schemas/DeckEnum'
        seat_type:
          $ref: '#/components/schemas/SeatTypeEnum'
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        is_available:
          type: boolean
        is_ladies_only:
          type: boolean
        is_booked:
          type: boolean
        trip:
          type: integer
      required:
      - id
      - seat_number
      - trip
    BusTrip:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        operator:
          allOf:
          - $ref: '#/components/schemas/BusOperator'
          readOnly: true
        seats:
          type: array
          items:
            $ref: '#/components/schemas/BusSeat'
          readOnly: true
        bus_type:
          $ref: '#/components/schemas/BusTypeEnum'
        bus_name:
          type: string
          maxLength: 150
        origin:
          type: string
          maxLength: 100
        destination:
          type: string
          maxLength: 100
        departure_time:
          type: string
          description: e.g. 09:00 PM
          maxLength: 10
        arrival_time:
          type: string
          description: e.g. 06:30 AM
          maxLength: 10
        duration:
          type: string
          description: e.g. 9h 30m
          maxLength: 50
        fare_seater:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        fare_sleeper:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        boarding_points: {}
        dropping_points: {}
        total_seats:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        available_seats_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        amenities: {}
      required:
      - arrival_time
      - departure_time
      - destination
      - duration
      - id
      - operator
      - origin
      - seats
    BusTypeEnum:
      enum:
      - ac_sleeper
      - volvo_multi_axle
      - scania_ac
      - non_ac_sleeper
      type: string
      description: |-
        * `ac_sleeper` - AC Sleeper (2+1)
        * `volvo_multi_axle` - Volvo Multi-Axle AC Semi-Sleeper (2+2)
        * `scania_ac` - Scania AC Executive (2+2)
        * `non_ac_sleeper` - Non-AC Sleeper (2+1)
    CityEnum:
      enum:
      - makkah
      - madinah
      type: string
      description: |-
        * `makkah` - Makkah
        * `madinah` - Madinah
    CouponCode:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 50
        title:
          type: string
          maxLength: 150
        description:
          type: string
        discount_type:
          $ref: '#/components/schemas/DiscountTypeEnum'
        discount_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        max_discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        min_booking_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        applicable_module:
