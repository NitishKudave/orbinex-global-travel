          description: ''
  /api/v1/buses/search/:
    get:
      operationId: buses_search_list
      summary: Search bus trips by origin and destination
      parameters:
      - in: query
        name: bus_type
        schema:
          type: string
        description: Bus type filter
      - in: query
        name: destination
        schema:
          type: string
        description: Destination city
      - in: query
        name: origin
        schema:
          type: string
        description: Origin city
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - buses
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusTripList'
          description: ''
  /api/v1/europamundo/book/:
    post:
      operationId: europamundo_book_create
      summary: Book a Europamundo circuit tour
      tags:
      - europamundo
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
