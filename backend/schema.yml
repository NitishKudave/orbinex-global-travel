      tags:
      - medical
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMedicalPackageList'
          description: ''
  /api/v1/medical/specialties/:
